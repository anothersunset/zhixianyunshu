standard_whitelist: []
features:
- keyword: ROWNUM
  mapping: LIMIT / ROW_NUMBER() OVER()
  category: pseudo-column
  is_recipe: true
  construct_name: ROWNUM Pagination
  few_shot_source: SELECT * FROM (SELECT e.*, ROWNUM rn FROM emp e WHERE ROWNUM <= 20) WHERE rn > 10
  few_shot_target: SELECT * FROM emp LIMIT 10 OFFSET 10
  step_by_step: 1. 判断 ROWNUM 用途。2. LIMIT = 外层条件值, OFFSET = 内层条件值。3. 绝对不要将 ROW_NUMBER() OVER() 与 LIMIT 组合。
  pitfalls:
  - NEVER combine ROW_NUMBER() OVER() with LIMIT
  - Do NOT nest ROW_NUMBER() inside a subquery that already has LIMIT
- keyword: CONNECT BY
  mapping: WITH RECURSIVE
  category: syntax
  is_recipe: true
  construct_name: CONNECT BY Hierarchy
  few_shot_source: SELECT CONNECT_BY_ISLEAF AS is_leaf, LEVEL AS lvl, name FROM emp START WITH manager_id IS NULL CONNECT
    BY PRIOR id = manager_id
  few_shot_target: WITH RECURSIVE emp_tree AS (SELECT id, name, manager_id, 0 AS lvl, false AS is_leaf FROM emp WHERE manager_id
    IS NULL UNION ALL SELECT e.id, e.name, e.manager_id, t.lvl+1, NOT EXISTS(SELECT 1 FROM emp WHERE manager_id=e.id) FROM
    emp e JOIN emp_tree t ON e.manager_id = t.id) SELECT is_leaf, lvl, name FROM emp_tree
  step_by_step: 1. START WITH -> CTE anchor WHERE。2. CONNECT BY PRIOR -> 递归 JOIN。3. LEVEL 从 0 开始。4. CONNECT_BY_ISLEAF 在 CTE
    内计算为 boolean。5. 用 WITH RECURSIVE 包装。
  pitfalls:
  - LEVEL must start at 0 in anchor
  - CONNECT_BY_ISLEAF must be computed INSIDE CTE as boolean
  - Do NOT forget parent_id column in CTE column list
- keyword: MERGE INTO
  mapping: INSERT ... ON CONFLICT
  category: syntax
  is_recipe: true
  construct_name: MERGE INTO Upsert
  few_shot_source: MERGE INTO target t USING source s ON (t.id = s.id) WHEN MATCHED THEN UPDATE SET t.name = s.name WHEN NOT
    MATCHED THEN INSERT (id, name) VALUES (s.id, s.name)
  few_shot_target: INSERT INTO target (id, name) SELECT id, name FROM source ON CONFLICT (id) DO UPDATE SET name = EXCLUDED.name
  step_by_step: 1. USING 数据源 -> INSERT ... SELECT FROM。2. ON 条件 -> ON CONFLICT 目标列。3. WHEN MATCHED UPDATE -> DO UPDATE SET,
    用 EXCLUDED。4. WHEN NOT MATCHED INSERT -> INSERT/SELECT 列表。5. 移除 Oracle 表别名前缀。
  pitfalls:
  - CONFLICT target must have UNIQUE constraint
  - Use EXCLUDED.column_name
  - WHEN NOT MATCHED INSERT columns go into INSERT/SELECT, not VALUES
- keyword: TRUNC(
  mapping: TRUNC (numbers same) / DATE_TRUNC (dates)
  category: function
  is_recipe: true
  construct_name: TRUNC distinguish numeric vs date
  few_shot_source: SELECT TRUNC(salary) FROM emp
  few_shot_target: SELECT TRUNC(salary) FROM emp
  step_by_step: 1. 判断 TRUNC 参数类型：数字则 PG 中 TRUNC 也支持。2. 日期则转为 DATE_TRUNC('day', col)。3. 不确定则保留 TRUNC。
  pitfalls:
  - Do NOT blindly convert TRUNC to DATE_TRUNC
  - Only convert TRUNC(date) to DATE_TRUNC
- keyword: MONTHS_BETWEEN(
  mapping: EXTRACT(YEAR FROM age(a,b))*12 + EXTRACT(MONTH FROM age(a,b))
  category: function
  is_recipe: true
  construct_name: MONTHS_BETWEEN
  few_shot_source: SELECT MONTHS_BETWEEN(date1, date2) FROM t
  few_shot_target: SELECT EXTRACT(YEAR FROM age(date1, date2)) * 12 + EXTRACT(MONTH FROM age(date1, date2)) FROM t
  step_by_step: COPY the Target example output character-by-character. Do NOT add EXTRACT(DAY ...) fraction.
  pitfalls:
  - NEVER add + EXTRACT(DAY FROM ...) / N to the formula
- keyword: ADD_MONTHS(
  mapping: date + INTERVAL 'n months'
  category: function
  is_recipe: true
  construct_name: ADD_MONTHS
  few_shot_source: SELECT ADD_MONTHS(hire_date, 6) FROM emp
  few_shot_target: SELECT hire_date + INTERVAL '6 months' FROM emp
  step_by_step: 1. ADD_MONTHS(date_col, N) -> date_col + INTERVAL 'N months'。2. N 为负时用 - INTERVAL。
  pitfalls:
  - NEVER use DATEADD() or DATE_ADD()
  - NEVER use MAKE_INTERVAL
- keyword: LISTAGG(
  mapping: STRING_AGG(col, delim ORDER BY col)
  category: function
  is_recipe: true
  construct_name: LISTAGG
  few_shot_source: SELECT LISTAGG(name, ',') WITHIN GROUP (ORDER BY name) FROM emp GROUP BY dept
  few_shot_target: SELECT STRING_AGG(name, ',' ORDER BY name) FROM emp GROUP BY dept
  step_by_step: 1. LISTAGG(col, delim) WITHIN GROUP (ORDER BY col) -> STRING_AGG(col, delim ORDER BY col)。2. 分隔符是第二个参数。3.
    WITHIN GROUP ORDER BY -> STRING_AGG 内的 ORDER BY。
  pitfalls:
  - NEVER use GROUP_CONCAT (MySQL syntax)
  - ORDER BY goes INSIDE STRING_AGG
- keyword: REGEXP_SUBSTR(
  mapping: (REGEXP_MATCHES(str,pattern))[1]
  category: function
  is_recipe: true
  construct_name: REGEXP_SUBSTR
  few_shot_source: SELECT REGEXP_SUBSTR(email, '[^@]+') FROM users
  few_shot_target: SELECT (REGEXP_MATCHES(email, '[^@]+'))[1] FROM users
  step_by_step: COPY the Target example output character-by-character. Use REGEXP_MATCHES (with S). Do NOT use SUBSTRING,
    regexp_match, or split_part.
  pitfalls:
  - NEVER use SUBSTRING() for regex extraction
  - NEVER use regexp_match (singular)
  - NEVER use split_part() as shortcut
