- keyword: ROWNUM
  mapping: LIMIT / ROW_NUMBER() OVER()
  category: pseudo-column
  is_recipe: true
  construct_name: ROWNUM Pagination
  few_shot_source: SELECT * FROM (SELECT e.*, ROWNUM rn FROM emp e WHERE ROWNUM <= 20) WHERE rn > 10
  few_shot_target: SELECT * FROM emp LIMIT 10 OFFSET 10
  step_by_step: 1. 判断 ROWNUM 用途。2. LIMIT = 外层条件值, OFFSET = 内层条件值。3. 绝对不要将 ROW_NUMBER() OVER() 与 LIMIT 组合。
  pitfalls:
  - NEVER combine ROW_NUMBER() OVER() with LIMIT
  - Do NOT nest ROW_NUMBER() inside a subquery that already has LIMIT
- keyword: CONNECT BY
  mapping: WITH RECURSIVE
  category: syntax
  is_recipe: true
  construct_name: CONNECT BY to WITH RECURSIVE Hierarchical Query
  few_shot_source: "SELECT CONNECT_BY_ISLEAF AS is_leaf, LEVEL AS lvl, name \nFROM emp \nSTART WITH manager_id IS NULL \n\
    CONNECT BY PRIOR id = manager_id\n"
  few_shot_target: "WITH RECURSIVE emp_tree AS (\n  SELECT id, name, manager_id, 0 AS lvl, false AS is_leaf\n  FROM emp\n\
    \  WHERE manager_id IS NULL\n  UNION ALL\n  SELECT e.id, e.name, e.manager_id, t.lvl + 1,\n         NOT EXISTS(SELECT\
    \ 1 FROM emp WHERE manager_id = e.id) AS is_leaf\n  FROM emp e\n  JOIN emp_tree t ON e.manager_id = t.id\n)\nSELECT is_leaf,\
    \ lvl, name FROM emp_tree\n"
  step_by_step: '1. Replace START WITH with the anchor member: SELECT base columns, 0 AS lvl, false AS is_leaf FROM table
    WHERE root_condition.

    2. Replace CONNECT BY PRIOR with the recursive member: SELECT child columns, parent.lvl + 1, NOT EXISTS(SELECT 1 FROM
    table WHERE manager_id = child.id) AS is_leaf FROM table child JOIN recursive_cte parent ON child.manager_id = parent.id.

    3. Set LEVEL to start at 0 (not 1) in the anchor, then increment by 1 in the recursive member.

    4. Compute CONNECT_BY_ISLEAF using NOT EXISTS in the recursive member (check if child has no children), not with a separate
    LEFT JOIN or CASE in the final SELECT.

    5. Wrap the entire query in WITH RECURSIVE cte_name AS (...) and select the final columns from the CTE.

    '
  pitfalls:
  - DO NOT start LEVEL at 1 in the anchor; it must be 0 to match Oracle's LEVEL behavior (root = 1 in Oracle, but PostgreSQL
    convention uses 0-based start).
  - DO NOT compute is_leaf using a LEFT JOIN or subquery in the final SELECT; it must be computed per row in the recursive
    member using NOT EXISTS to ensure correctness for all nodes.
  - DO NOT use CASE WHEN EXISTS to determine is_leaf; use NOT EXISTS directly as a boolean expression in the recursive member.
  - DO NOT forget to include the is_leaf column in both the anchor and recursive member of the CTE; omitting it from the anchor
    causes NULL values for root nodes.
- keyword: MERGE INTO
  mapping: INSERT INTO ... SELECT ... ON CONFLICT
  category: syntax
  is_recipe: true
  construct_name: MERGE INTO to INSERT ON CONFLICT Upsert
  few_shot_source: 'MERGE INTO target t USING source s ON (t.id = s.id)

    WHEN MATCHED THEN UPDATE SET t.name = s.name, t.updated = s.ts

    WHEN NOT MATCHED THEN INSERT (id, name) VALUES (s.id, s.name)

    '
  few_shot_target: "INSERT INTO target (id, name, updated)\nSELECT id, name, ts FROM source\nON CONFLICT (id) DO UPDATE SET\n\
    \  name = EXCLUDED.name,\n  updated = EXCLUDED.updated\n"
  step_by_step: '1. 将 MERGE INTO target [alias] 改为 INSERT INTO target (col1, col2, ...) — 不要保留 MERGE INTO

    2. 将 USING source [alias] ON (条件) 改为 SELECT col1, col2, ... FROM source — 不需要表别名，直接用列名

    3. ON 条件中的等值列必须作为 ON CONFLICT 的目标列（需有 UNIQUE 约束）

    4. WHEN MATCHED THEN UPDATE SET col = val → DO UPDATE SET col = EXCLUDED.col，所有 SET 列值用 EXCLUDED. 前缀

    5. WHEN NOT MATCHED THEN INSERT (cols) VALUES (vals) → 列已在 INSERT 列表中，值来自 SELECT 列表

    6. 移除所有 Oracle 表别名（t.col → col），目标列不加前缀，源表值不加别名

    7. 绝对不要保留 MERGE INTO 语法 — PostgreSQL 完全不支持它

    '
  pitfalls:
  - DO NOT keep MERGE INTO syntax in the output — PostgreSQL has no MERGE INTO, the correct conversion is INSERT ... ON CONFLICT
  - DO NOT put VALUES clause after INSERT ... SELECT — INSERT ... SELECT does not take VALUES, the SELECT provides all row
    data
  - DO NOT use Oracle table alias (t.) in the ON CONFLICT ... DO UPDATE SET clause — use EXCLUDED. to reference incoming row
    values
  - DO NOT forget the UNIQUE constraint on the ON CONFLICT column — if the source table lacks a UNIQUE index on the join key,
    ON CONFLICT will fail
  - DO NOT include columns that are only in the UPDATE in the INSERT column list — INSERT columns should cover both INSERT
    and UPDATE scenarios
  - DO NOT use WHEN NOT MATCHED columns outside of the INSERT/SELECT — they are the same as the INSERT column values
- keyword: TRUNC(
  mapping: TRUNC (numbers same) / DATE_TRUNC (dates)
  category: function
  is_recipe: true
  construct_name: TRUNC distinguish numeric vs date
  few_shot_source: SELECT TRUNC(salary) FROM emp
  few_shot_target: SELECT TRUNC(salary) FROM emp
  step_by_step: 1. 判断 TRUNC 参数类型：数字则 PG 中 TRUNC 也支持。2. 日期则转为 DATE_TRUNC('day', col)。3. 不确定则保留 TRUNC。
  pitfalls:
  - Do NOT blindly convert TRUNC to DATE_TRUNC
  - Only convert TRUNC(date) to DATE_TRUNC
- keyword: MONTHS_BETWEEN(
  mapping: EXTRACT(YEAR FROM age(a,b))*12 + EXTRACT(MONTH FROM age(a,b))
  category: function
  is_recipe: true
  construct_name: MONTHS_BETWEEN Date Difference
  few_shot_source: 'SELECT MONTHS_BETWEEN(end_date, start_date) AS month_diff FROM project_schedule;

    '
  few_shot_target: 'SELECT EXTRACT(YEAR FROM age(end_date, start_date)) * 12 + EXTRACT(MONTH FROM age(end_date, start_date))
    AS month_diff FROM project_schedule;

    '
  step_by_step: '1. Replace MONTHS_BETWEEN(date1, date2) with EXTRACT(YEAR FROM age(date1, date2)) * 12 + EXTRACT(MONTH FROM
    age(date1, date2)).

    2. Use the PostgreSQL age() function to compute the interval between the two dates (age(date1, date2) returns years, months,
    days).

    3. Extract the YEAR component from the interval and multiply by 12 to convert years to months.

    4. Extract the MONTH component from the interval and add it to the result.

    5. Do NOT add any fractional day calculation (e.g., + EXTRACT(DAY FROM ...)/30.0) — this is not part of the standard conversion
    and will produce incorrect results.

    '
  pitfalls:
  - DO NOT add a fractional day component like + (EXTRACT(DAY FROM AGE(date1, date2)) / 30.0). This overcomplicates the result
    and does not match Oracle's integer month behavior.
  - DO NOT use direct year/month subtraction like (EXTRACT(YEAR FROM date1) - EXTRACT(YEAR FROM date2)) * 12 + (EXTRACT(MONTH
    FROM date1) - EXTRACT(MONTH FROM date2)). This ignores day-level carryover and produces wrong results when day-of-month
    differs.
- keyword: ADD_MONTHS(
  mapping: date + INTERVAL 'n months'
  category: function
  is_recipe: true
  construct_name: ADD_MONTHS
  few_shot_source: SELECT ADD_MONTHS(hire_date, 6) FROM emp
  few_shot_target: SELECT hire_date + INTERVAL '6 months' FROM emp
  step_by_step: 1. ADD_MONTHS(date_col, N) -> date_col + INTERVAL 'N months'。2. N 为负时用 - INTERVAL。
  pitfalls:
  - NEVER use DATEADD() or DATE_ADD()
  - NEVER use MAKE_INTERVAL
- keyword: LISTAGG(
  mapping: STRING_AGG(col, delim ORDER BY col)
  category: function
  is_recipe: true
  construct_name: LISTAGG
  few_shot_source: SELECT LISTAGG(name, ',') WITHIN GROUP (ORDER BY name) FROM emp GROUP BY dept
  few_shot_target: SELECT STRING_AGG(name, ',' ORDER BY name) FROM emp GROUP BY dept
  step_by_step: 1. LISTAGG(col, delim) WITHIN GROUP (ORDER BY col) -> STRING_AGG(col, delim ORDER BY col)。2. 分隔符是第二个参数。3.
    WITHIN GROUP ORDER BY -> STRING_AGG 内的 ORDER BY。
  pitfalls:
  - NEVER use GROUP_CONCAT (MySQL syntax)
  - ORDER BY goes INSIDE STRING_AGG
- keyword: REGEXP_SUBSTR(
  mapping: (REGEXP_MATCHES(str,pattern))[1]
  category: function
  is_recipe: true
  construct_name: REGEXP_SUBSTR
  few_shot_source: SELECT REGEXP_SUBSTR(email, '[^@]+') FROM users
  few_shot_target: SELECT (REGEXP_MATCHES(email, '[^@]+'))[1] FROM users
  step_by_step: COPY the Target example output character-by-character. Use REGEXP_MATCHES (with S). Do NOT use SUBSTRING,
    regexp_match, or split_part.
  pitfalls:
  - NEVER use SUBSTRING() for regex extraction
  - NEVER use regexp_match (singular)
  - NEVER use split_part() as shortcut
