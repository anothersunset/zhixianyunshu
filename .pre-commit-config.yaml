# Pre-commit hooks — 提交前自动运行冒烟检
# 安装: pip install pre-commit && pre-commit install
# 手动跑: pre-commit run --all-files
repos:
  - repo: local
    hooks:
      - id: smoke-test
        name: smoke test (三路冒烟检)
        entry: bash scripts/smoke-test.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']
