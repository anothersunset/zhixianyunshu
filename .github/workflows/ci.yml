# v1.0.2 hotfix: CI workflow 模板。原 .github/workflows/ci.yml 中
# GitHub Actions 二重括号表达式被上游 URL 压缩吃成数字占位符, 4 处全坏。
# 本模板用 "${{ name }}" (单 $ + 上下空格) 作占位, 由 scripts/install-supply-chain-workflow.sh
# 一键 sed 还原回真表达式后写入 .github/workflows/ci.yml。
# hashFiles 含特殊字符, 用 sentinel ${{ hashFiles('**/pom.xml') }} 单独替换。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zhiqian/backend
    strategy:
      matrix:
        java-version: ["17"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Build
        run: mvn compile -q

      - name: Run tests
        run: mvn test -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zhiqian/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  rag-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zhiqian/rag
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: zhiqian/rag/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Compile check
        run: python -m compileall -q app

      - name: Ruff lint
        run: ruff check app --select E,F,W --ignore E501 --quiet

      - name: Import chain verification
        run: |
          python - <<'PY'
          import importlib

          for module in ["app.main", "app.api.health", "app.pipelines.retriever"]:
              importlib.import_module(module)
              print(f"  OK {module}")
          PY

  labeler:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  eval-smoke:
    runs-on: ubuntu-latest
    needs: [backend-test, rag-lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: zhiqian/rag/requirements*.txt

      - name: Install eval dependencies
        run: pip install -r zhiqian/rag/requirements.txt

      - name: Eval smoke (5 cases)
        run: python -m eval.run_eval --retrieval full --pair all --fast --parallel 2
        env:
          MIGRATION_BASE_URL: http://localhost:8080
          RAG_BASE_URL: http://localhost:8001
        continue-on-error: true
