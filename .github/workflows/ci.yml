name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zhiqian/backend
    strategy:
      matrix:
        java-version: ["17"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Test and enforce core coverage
        run: mvn verify -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zhiqian/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  rag-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zhiqian/rag
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6

      - name: Install frozen dependencies
        run: uv sync --frozen --extra test

      - name: Compile check
        run: uv run python -m compileall -q app

      - name: Ruff lint
        run: uvx ruff check app --select E,F,W --ignore E501 --quiet

      - name: Import chain verification
        run: |
          uv run python - <<'PY'
          import importlib

          for module in ["app.main", "app.api.health", "app.pipelines.retriever"]:
              importlib.import_module(module)
              print(f"  OK {module}")
          PY

  labeler:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  eval-smoke:
    runs-on: ubuntu-latest
    needs: [backend-test, rag-lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6

      - name: Install frozen eval dependencies
        working-directory: zhiqian/rag
        run: uv sync --frozen --extra test

      - name: Deterministic eval tests
        run: zhiqian/rag/.venv/bin/python -m pytest -q eval/tests
