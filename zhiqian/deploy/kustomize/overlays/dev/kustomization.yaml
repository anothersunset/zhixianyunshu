# v2-step-18: dev overlay - 轻量化 单副本 NodePort
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: zhiqian-dev
resources:
  - ../../base
namePrefix: dev-
commonLabels:
  env: dev
replicas:
  - name: zhiqian-backend
    count: 1
  - name: zhiqian-rag
    count: 1
  - name: zhiqian-web
    count: 1
patches:
  # base 的 namespace.yaml 定义的是名为 zhiqian 的 Namespace 对象，而本 overlay
  # 的 namespace 字段是 zhiqian-dev。新版 kustomize（>= v4.1）会自动把 Namespace
  # 对象改名到目标 namespace；旧版（及部分 ArgoCD 内置的旧 kustomize）不会，导致
  # 纯 kubectl 路径额外创建一个空的 zhiqian 命名空间而资源落在 zhiqian-dev。
  # 显式改名，保证不同工具链版本下行为一致。
  - target:
      kind: Namespace
      name: zhiqian
    patch: |-
      - op: replace
        path: /metadata/name
        value: zhiqian-dev
  - target:
      kind: Service
      name: zhiqian-web
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
  - target:
      kind: Service
      name: zhiqian-backend
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30880
  - target:
      kind: Deployment
      name: zhiqian-rag
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 2Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
images:
  - name: zhiqian/backend
    newTag: dev
  - name: zhiqian/rag
    newTag: dev
  - name: zhiqian/web
    newTag: dev
