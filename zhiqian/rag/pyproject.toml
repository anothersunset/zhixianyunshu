[project]
name = "zhiqian-rag"
version = "2.0.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.111.0", "starlette==0.37.2", "uvicorn[standard]==0.30.1",
  "pydantic==2.9.2", "pydantic-settings==2.6.1", "jinja2==3.1.4",
  "httpx==0.27.2", "numpy==1.26.4", "scikit-learn==1.4.2",
  "rank-bm25==0.2.2", "jieba==0.42.1", "chromadb==0.5.4",
  "qdrant-client==1.11.3", "orjson==3.10.3", "python-multipart==0.0.9",
  "langfuse==2.50.0", "sqlglot==25.16.1", "duckduckgo-search==6.2.10",
  "psutil==6.0.0", "jsonschema==4.23.0", "networkx==3.3", "PyYAML==6.0.2",
  "typer==0.12.5",
]

[project.optional-dependencies]
test = ["pytest==8.3.3", "pytest-asyncio==0.24.0"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "zhiqian_rag*"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
